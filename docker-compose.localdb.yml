# Adds a local Postgres 16 and points the API at it, for testing without touching your Supabase database:
#   docker compose -f docker-compose.yml -f docker-compose.localdb.yml up --build
# The tables, the 8 emotions and your seed data load the first time the database starts.
# Sign-in still goes to Supabase, so SUPABASE_* in backend/.env must still be filled in.
# To start over with an empty database:  docker compose -f docker-compose.yml -f docker-compose.localdb.yml down -v
services:
  api:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/temple
      DATABASE_SSL: "0"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temple
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Files here run once, in name order, when the data folder is empty.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/schema_additions.sql:/docker-entrypoint-initdb.d/02-schema-additions.sql:ro
      - ./docker/emotions.sql:/docker-entrypoint-initdb.d/03-emotions.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # optional: lets you inspect it from your computer on port 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temple"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbdata:
